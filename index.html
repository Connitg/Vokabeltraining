<!-- Hauptbereich mit Screens -->
    <main class="content-area">
        <!-- SCREEN 1: LERNEN -->
        <section id="view-learn" class="view active">
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="de-en">DE ➔ EN</button>
                <button class="mode-tab" data-mode="en-de">EN ➔ DE</button>
                <button class="mode-tab" data-mode="quiz">Quiz</button>
                <button class="mode-tab" data-mode="card">Kartei</button>
            </div>

            <div id="study-card" class="study-card">
                <span id="card-tag" class="card-tag">Deutsch</span>
                <h2 id="question-text" class="question-text">Lade...</h2>
                
                <div id="type-answer-box" class="answer-box">
                    <input type="text" id="user-input" placeholder="Antwort eingeben..." autocomplete="off" spellcheck="false">
                    <button id="submit-btn" class="action-btn primary">Überprüfen</button>
                </div>

                <div id="quiz-grid" class="quiz-grid hidden"></div>

                <div id="flashcard-box" class="flashcard-box hidden">
                    <button id="reveal-btn" class="action-btn secondary">Übersetzung anzeigen</button>
                    <div id="revealed-answer" class="revealed-answer hidden">---</div>
                    <div id="fc-actions" class="fc-actions hidden">
                        <button id="fc-wrong" class="fc-btn wrong">Falsch</button>
                        <button id="fc-correct" class="fc-btn correct">Gewusst!</button>
                    </div>
                </div>

                <div id="feedback" class="feedback"></div>
            </div>
        </section>

        <!-- SCREEN 2: VOKABELLISTE -->
        <section id="view-list" class="view">
            <div class="screen-header">
                <h2>Deine Vokabeln (<span id="total-count">0</span>)</h2>
                <button id="clear-all-btn" class="text-btn danger">Alle löschen</button>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Vokabel suchen...">
            </div>

            <div id="vocab-container" class="vocab-container"></div>
        </section>

        <!-- SCREEN 3: IMPORT -->
        <section id="view-import" class="view">
            <div class="screen-header">
                <h2>Vokabeln hinzufügen</h2>
            </div>

            <div class="import-card">
                <label for="import-text">Vokabelliste reinkopieren</label>
                <p class="sub-text">Format: <code>Deutsch = Englisch</code> (eine pro Zeile)</p>
                <textarea id="import-text" rows="8" placeholder="Hund = dog&#10;Katze = cat&#10;Haus = house"></textarea>
                <button id="run-import-btn" class="action-btn primary">Importieren</button>
            </div>
        </section>
    </main>

    <!-- Untere Navigationsleiste -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="view-learn">
            <span class="nav-icon">🎯</span>
            <span class="nav-label">Lernen</span>
        </button>
        <button class="nav-item" data-target="view-list">
            <span class="nav-icon">📚</span>
            <span class="nav-label">Vokabeln</span>
        </button>
        <button class="nav-item" data-target="view-import">
            <span class="nav-icon">➕</span>
            <span class="nav-label">Import</span>
        </button>
    </nav>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="modal-backdrop hidden">
    <div class="modal-card">
        <h3>Vokabel bearbeiten</h3>
        <div class="field-group">
            <label>Deutsch</label>
            <input type="text" id="edit-de-val">
        </div>
        <div class="field-group">
            <label>Englisch</label>
            <input type="text" id="edit-en-val">
        </div>
        <div class="modal-btns">
            <button id="cancel-edit" class="action-btn secondary">Abbrechen</button>
            <button id="save-edit" class="action-btn primary">Speichern</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
