
   <!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeltrainer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Vokabeltrainer</h1>

        <!-- Massen-Import Sektion -->
        <details class="import-section">
            <summary>🚀 Massen-Import / Liste einfügen</summary>

            <p class="hint">Füge hier mehrere Vokabeln ein (Format: <code>Deutsch = Englisch</code> oder <code>Deutsch - Englisch</code>, eine pro Zeile):</p>
            <textarea id="import-text" rows="6" placeholder="Hund = dog&#10;Katze = cat&#10;Haus = house"></textarea>
            <button id="import-btn" class="secondary-btn">Liste Importieren</button>
        </details>

        <hr class="divider">

        <!-- Einzelne Vokabel hinzufügen -->
        <div class="add-section">
            <h3>Einzelne Vokabel hinzufügen</h3>
            <input type="text" id="de-input" placeholder="Deutsches Wort">
            <input type="text" id="en-input" placeholder="Englische Übersetzung">
            <button id="add-btn">Hinzufügen</button>
        </div>

        <hr class="divider">

        <!-- Abfrage-Bereich -->
        <div class="quiz-section">
            <h3>Lernen</h3>
            <div id="card" class="card">
                <p id="question">Keine Vokabeln vorhanden.</p>
            </div>
            <input type="text" id="answer-input" placeholder="Deine Antwort...">
            <button id="check-btn">Überprüfen</button>
            <p id="result-msg"></p>
        </div>

        <!-- Liste anzeigen / verwalten -->
        <details class="list-section">
            <summary>📚 Alle Vokabeln anzeigen (<span id="count">0</span>)</summary>
            <ul id="vocab-list"></ul>
            <button id="clear-btn" class="danger-btn">Alle Vokabeln löschen</button>
        </details>
    </div>

    <script src="app.js"></script>
</body>
</html>
