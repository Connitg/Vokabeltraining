<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VocabMaster</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">VOCAB<span>MASTER</span></div>
    </header>

    <main id="main-content">
      <!-- SECTION 1: SCAN -->
      <section id="scan-sec" class="active">
        <div class="card">
          <h2>Tabelle scannen</h2>
          <p class="desc">Fotografiere deine Vokabeln gut beleuchtet ab.</p>

          <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
          <button class="btn btn-primary btn-hero" onclick="document.getElementById('photo-input').click()">
            📷 Foto aufnehmen
          </button>

          <!-- Bild-Vorschau -->
          <div id="image-preview-container" class="image-preview" style="display:none;">
            <img id="image-preview" src="" alt="Vorschau">
          </div>

          <!-- Ladebalken & Status -->
          <div id="progress-container" class="progress-box" style="display:none;">
            <div class="progress-info">
              <span id="status-text">Analysiere Bild...</span>
              <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
              <div id="progress-bar" class="progress-bar-fill"></div>
            </div>
          </div>

          <!-- Ergebnis-Feld -->
          <div id="ocr-result" style="display:none;" class="result-box">
            <p class="desc">Erkannter Text (Format: <code>Englisch - Deutsch</code>):</p>
            <textarea id="raw-text" rows="5"></textarea>
            <div class="button-row">
              <button class="btn btn-secondary" onclick="swapLanguagesInText()">🔄 En/De drehen</button>
              <button class="btn btn-success" onclick="parseAndSaveVocab()">💾 Speichern</button>
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 2: ADD MANUAL -->
      <section id="add-sec">
        <div class="card">
          <h2>Einzelne Vokabel hinzufügen</h2>
          <div class="field">
            <label>Englisch</label>
            <input type="text" id="manual-en" placeholder="z.B. resilience">
          </div>
          <div class="field">
            <label>Deutsch</label>
            <input type="text" id="manual-de" placeholder="z.B. Widerstandsfähigkeit">
          </div>
          <button class="btn btn-success" onclick="addSingleVocab()">Hinzufügen</button>
        </div>
      </section>

      <!-- SECTION 3: CARDS -->
      <section id="cards-sec">
        <div id="flashcard" class="flashcard" onclick="flipCard()">
          <span id="card-lvl" class="lvl-badge">Level 1</span>
          <div id="card-content">Lade...</div>
          <span class="hint-text">Tippen zum Umdrehen</span>
        </div>
        <div id="card-controls" class="controls-row" style="display:none;">
          <button class="btn btn-danger" onclick="rateCard(false)">❌ Falsch</button>
          <button class="btn btn-success" onclick="rateCard(true)">✅ Richtig</button>
        </div>
      </section>

      <!-- SECTION 4: QUIZ -->
      <section id="quiz-sec">
        <div class="card quiz-card">
          <h2>Tipp-Quiz</h2>
          <p class="desc">Übersetze auf Deutsch:</p>
          <div id="quiz-prompt" class="quiz-target">-</div>
          <input type="text" id="quiz-input" placeholder="Antwort eintippen..." autocomplete="off">
          <button class="btn btn-primary" onclick="checkAnswer()">Prüfen</button>
          <div id="quiz-feedback" class="feedback-text"></div>
        </div>
      </section>

      <!-- SECTION 5: LIST -->
      <section id="list-sec">
        <div class="card">
          <h2>Gespeicherte Vokabeln</h2>
          <ul id="vocab-list" class="vocab-list"></ul>
          <button class="btn btn-danger-outline" onclick="clearVocab()">Alle Vokabeln löschen</button>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button onclick="navTo('scan-sec', this)" class="active">📷 <span>Scan</span></button>
      <button onclick="navTo('add-sec', this)">➕ <span>Neu</span></button>
      <button onclick="navTo('cards-sec', this)">🃏 <span>Karten</span></button>
      <button onclick="navTo('quiz-sec', this)">✍️ <span>Quiz</span></button>
      <button onclick="navTo('list-sec', this)">📚 <span><span id="vocab-count">0</span></span></button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
